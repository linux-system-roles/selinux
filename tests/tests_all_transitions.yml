---
- name: Test all the possible selinux_state transitions
  hosts: all
  tags:
    - tests::reboot
  vars:
    states:
      - permissive
      - enforcing
      - disabled

  tasks:
    - name: Check if test is supported
      vars:
        ostree_booted_file: /run/ostree-booted
      block:
        - name: Check if system is ostree
          stat:
            path: "{{ ostree_booted_file }}"
          register: __ostree_booted_stat

        - name: Skip if not supported
          meta: end_host
          when: __ostree_booted_stat.stat.exists

    - name: Include test variables
      import_tasks: set_selinux_variables.yml

    - name: Save config
      include_tasks: selinux_config_save.yml

    - name: Get selinux facts
      setup:
        filter: ansible_selinux

    - name: Save selinux state before test
      set_fact:
        __state_before: "{{ ansible_facts['selinux']['mode'] | d(ansible_facts['selinux']['status']) }}"
        __type_before: "{{ ansible_facts['selinux']['type'] }}"

    - name: See if we can use update_kernel_param
      set_fact:
        __test_update_kernel_param: "{{ ansible_facts['os_family'] == 'RedHat' and
          ansible_facts['distribution_major_version'] is version('8', '>=') and
          ansible_version.full is version('2.10', '>=') }}"

    # Managed nodes with python 2 (EL7 with ansible 2.9, where ansible.posix
    # cannot be installed) use the vendored selinux_python_27 module, which
    # retains python 2 support; python 3 nodes use the bare selinux name, which
    # redirects to the latest ansible.posix.selinux.
    - name: Disable selinux and set kernel - python 2
      selinux_python_27:
        state: disabled
        update_kernel_param: "{{ true if __test_update_kernel_param else omit }}"
      register: __disable_result_py2
      when: ansible_facts['python_version'] is version('3', '<')

    # Bare name (not FQCN): an unresolvable FQCN aborts play parsing on ansible
    # 2.9 even when the task is skipped, so the bare name is used. This runs
    # only on managed nodes with python 3, where the bare selinux name resolves
    # to the latest ansible.posix.selinux.
    - name: Disable selinux and set kernel
      selinux:  # noqa fqcn
        state: disabled
        update_kernel_param: "{{ true if __test_update_kernel_param else omit }}"
      register: __disable_result_py3
      when: ansible_facts['python_version'] is version('3', '>=')

    - name: Set disable result
      set_fact:
        __disable_result: "{{ __disable_result_py2
          if ansible_facts['python_version'] is version('3', '<')
          else __disable_result_py3 }}"

    - name: Add selinux=0 to kernel args
      when:
        - not __test_update_kernel_param
        - __disable_result.reboot_required
      include_role:
        name: fedora.linux_system_roles.bootloader
      vars:
        bootloader_settings:
          - kernel: ALL
            options:
              - name: selinux
                value: "0"
                state: present

    - name: Show __disable_result
      debug:
        msg: __disable_result is {{ __disable_result | to_nice_json }}

    - name: Reboot
      reboot:
      when: __disable_result.reboot_required

    - name: Test all the possible state transitions
      include_tasks: selinux_test_transitions.yml
      vars:
        selinux_initial_state: "{{ item.0 }}"
        selinux_desired_state: "{{ item.1 }}"
      with_nested:
        - "{{ states }}"
        - "{{ states }}"

    - name: Restore config
      include_tasks: selinux_config_restore.yml

    # Managed nodes with python 2 (EL7 with ansible 2.9, where ansible.posix
    # cannot be installed) use the vendored selinux_python_27 module, which
    # retains python 2 support; python 3 nodes use the bare selinux name, which
    # redirects to the latest ansible.posix.selinux.
    - name: Re-enable selinux and set kernel if disabled - python 2
      selinux_python_27:
        state: "{{ __state_before }}"
        policy: "{{ __type_before }}"
        update_kernel_param: "{{ true if __test_update_kernel_param else omit }}"
      register: __enable_result_py2
      when:
        - __disable_result.reboot_required
        - ansible_facts['python_version'] is version('3', '<')

    # Bare name (not FQCN): an unresolvable FQCN aborts play parsing on ansible
    # 2.9 even when the task is skipped, so the bare name is used. This runs
    # only on managed nodes with python 3, where the bare selinux name resolves
    # to the latest ansible.posix.selinux.
    - name: Re-enable selinux and set kernel if disabled
      selinux:  # noqa fqcn
        state: "{{ __state_before }}"
        policy: "{{ __type_before }}"
        update_kernel_param: "{{ true if __test_update_kernel_param else omit }}"
      register: __enable_result_py3
      when:
        - __disable_result.reboot_required
        - ansible_facts['python_version'] is version('3', '>=')

    - name: Set enable result
      set_fact:
        __enable_result: "{{ __enable_result_py2
          if ansible_facts['python_version'] is version('3', '<')
          else __enable_result_py3 }}"

    - name: Remove selinux=0 from kernel args
      when:
        - not __test_update_kernel_param
        - __enable_result.reboot_required
      include_role:
        name: fedora.linux_system_roles.bootloader
      vars:
        bootloader_settings:
          - kernel: ALL
            options:
              - name: selinux
                value: "0"
                state: absent

    - name: Reboot
      reboot:
      when: __enable_result.reboot_required
