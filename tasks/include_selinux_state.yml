---
# selinux module call split by python version; args come from
# __selinux_state_args.

# python 2 (EL7/ansible 2.9, no ansible.posix collection): use the vendored
# selinux_python_27 copy, which retains python 2 support.
- name: Set permanent SELinux state - python 2
  selinux_python_27: "{{ __selinux_state_args }}"  # noqa args[module]
  register: __selinux_state_py2
  when:
    - ansible_facts['python_version'] is version('3', '<')

# python 3: bare name, not FQCN, because an unresolvable FQCN aborts play
# parsing on ansible 2.9 even when skipped; resolves to ansible.posix.selinux.
- name: Set permanent SELinux state
  selinux: "{{ __selinux_state_args }}"  # noqa fqcn args[module]
  register: __selinux_state_py3
  when:
    - ansible_facts['python_version'] is version('3', '>=')

# Only one branch above runs; coalesce its result for the caller.
- name: Consolidate SELinux state module output
  set_fact:
    __selinux_state_output: "{{ __selinux_state_py2
      if not (__selinux_state_py2.skipped | d(false))
      else __selinux_state_py3 }}"
