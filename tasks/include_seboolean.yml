---
# seboolean module call split by python version; args come from
# __selinux_seboolean_args.

# python 2 (EL7/ansible 2.9, no ansible.posix collection): use the vendored
# seboolean_python_27 copy, which retains python 2 support.
- name: Set SELinux booleans - python 2
  seboolean_python_27: "{{ __selinux_seboolean_args }}"  # noqa args[module]
  when:
    - ansible_facts['python_version'] is version('3', '<')

# python 3: bare name, not FQCN, because an unresolvable FQCN aborts play
# parsing on ansible 2.9 even when skipped; resolves to ansible.posix.seboolean.
- name: Set SELinux booleans
  seboolean: "{{ __selinux_seboolean_args }}"  # noqa fqcn args[module]
  when:
    - ansible_facts['python_version'] is version('3', '>=')
